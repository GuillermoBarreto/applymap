[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applymap"
version = "0.1.0"
description = "AI job-posting analyzer: score a job description against your profile, spot skill gaps, draft tailored cover letters"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Guillermo Barreto" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
applymap = "applymap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
